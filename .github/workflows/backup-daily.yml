name: Backup cada mañana → Google Drive

on:
  schedule:
    - cron: '0 14 * * *'  # 14:00 UTC = 8:00 AM Ciudad de México (UTC-6 todo el año)
  workflow_dispatch: # Permite ejecutarlo manualmente para pruebas

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
      RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}

    steps:
      - name: Instalar cliente PostgreSQL 17 (la versión debe coincidir con Supabase)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          curl https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Instalar rclone
        run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -o rclone-current-linux-amd64.zip
          sudo cp rclone-*-linux-amd64/rclone /usr/local/bin/
          rclone version | head -2

      - name: Exportar base de datos con pg_dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          TIMESTAMP=$(date -u +'%Y%m%d_%H%M%S')
          FILENAME="backup_daily_${TIMESTAMP}.sql.gz"
          pg_dump "$DATABASE_URL" --no-owner --no-privileges --clean --if-exists | gzip > "${FILENAME}"
          echo "FILENAME=${FILENAME}" >> "$GITHUB_ENV"

      - name: Subir a Google Drive
        run: |
          FOLDER="${GDRIVE_FOLDER:-backups-zapateria}"
          rclone copyto "${FILENAME}" "gdrive:${FOLDER}/diario/${FILENAME}" \
            --drive-chunk-size 8M

      - name: Aplicar retención (conserva los últimos 90 días)
        run: |
          FOLDER="${GDRIVE_FOLDER:-backups-zapateria}"
          rclone delete "gdrive:${FOLDER}/diario" --min-age 90d || true

      - name: Mostrar últimos backups subidos
        run: |
          FOLDER="${GDRIVE_FOLDER:-backups-zapateria}"
          rclone lsl "gdrive:${FOLDER}/diario" | tail -5
